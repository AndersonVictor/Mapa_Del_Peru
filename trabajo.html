<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junín y Huancavelica - Lista de trabajo</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; color: #222; background: #eef2f5; }
  body { display: grid; grid-template-columns: 320px 1fr; }
  #panel { overflow-y: auto; background: #fff; box-shadow: 1px 0 8px rgba(0,0,0,.12); z-index: 6; padding: 14px; font-size: 13px; }
  #panel h1 { font-size: 17px; margin: 0; }
  #panel .sub { color: #666; font-size: 12px; margin: 2px 0 10px; }
  #panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #555; margin: 14px 0 6px; }
  #combos { display: flex; flex-direction: column; gap: 6px; }
  select { width: 100%; font: inherit; padding: 5px; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  .botones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .btn { font: inherit; font-size: 12px; border: 1px solid #ccc; background: #fff; border-radius: 4px; padding: 5px 9px;
    cursor: pointer; color: #222; text-decoration: none; }
  .btn:hover { background: #f3f3f3; }
  .btn.rojo { background: #c8102e; border-color: #c8102e; color: #fff; }
  .btn.rojo:hover { background: #a50d26; }
  .leyenda { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .leyenda span { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 5px 6px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
  li:hover, li.activo { background: #f1f5fb; }
  li .niv { font-size: 10px; font-weight: 700; border-radius: 3px; padding: 1px 4px; flex: none; }
  li .n-DEPARTAMENTO { background: #e5e5e5; color: #222; }
  li .n-PROVINCIA { background: #fde68a; color: #6b4e00; }
  li .n-DISTRITO { background: #ddd6fe; color: #4c1d95; }
  li small { color: #777; }
  li.falta { cursor: default; color: #a00; }
  li.fuera { cursor: default; color: #888; }
  .nota { color: #777; font-size: 11px; margin-top: 4px; }
  .modo { display: flex; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
  .modo button { flex: 1; font: inherit; border: 0; background: #fff; padding: 7px; cursor: pointer; }
  .modo button + button { border-left: 1px solid #ccc; }
  .modo button.on { background: #1f2937; color: #fff; font-weight: 600; }
  .card { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin-top: 10px; }
  .card .grande { font-size: 22px; font-weight: 700; color: #8e1b2a; }
  .card .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-top: 6px; font-size: 12px; }
  .barra { display: grid; grid-template-columns: 90px 1fr 28px; gap: 6px; align-items: center; padding: 3px 4px;
    border-radius: 4px; cursor: pointer; font-size: 12px; }
  .barra:hover { background: #f1f5fb; }
  .barra i { display: block; height: 10px; border-radius: 3px; background: #c0392b; }
  .barra b { text-align: right; }
  .avisos { color: #8a5a00; font-size: 11px; margin-top: 8px; }
  .avisos div { margin-top: 3px; }
  [hidden] { display: none !important; }
  #mapwrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }
  #aviso { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 9; display: none;
    max-width: min(520px, calc(100% - 32px)); background: #fff3cd; color: #5c4400; border: 1px solid #e0b84c;
    border-radius: 8px; padding: 10px 14px; font-size: 14px; line-height: 1.5; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
    #panel { order: 2; box-shadow: 0 -1px 8px rgba(0,0,0,.12); }
    #mapwrap { order: 1; }
  }
</style>
</head>
<body>
<aside id="panel">
  <h1>Junín y Huancavelica</h1>
  <div class="sub">Lista de trabajo · Censo 2025 · se edita en <b>lista_trabajo.xlsx</b></div>
  <div class="modo"><button data-modo="poblacion">👥 Población</button><button data-modo="jueces">⚖️ Jueces</button></div>
  <div id="combos"></div>
  <div class="botones">
    <button class="btn" id="todo">⟲ Ver todo</button>
    <a class="btn rojo" href="/api/lista.xlsx">Descargar Excel</a>
    <a class="btn" href="/">← Mapa general</a>
  </div>
  <h2>Leyenda</h2>
  <div class="leyenda" id="ley-poblacion">
    <div><span style="background:#fcd34d"></span>Provincia de la lista</div>
    <div><span style="background:#a78bfa"></span>Distrito de la lista</div>
    <div><span style="background:#f4f1ea;border:1px solid #ccc"></span>Resto del departamento</div>
  </div>
  <div class="leyenda" id="ley-jueces" hidden></div>
  <div id="panel-jueces" hidden></div>
  <div id="lista"></div>
</aside>
<div id="mapwrap">
  <div id="map"></div>
  <div id="tip"></div>
  <div id="aviso"></div>
</div>
<script src="/vendor/maplibre-gl.js"></script>
<script src="/filtro.js"></script>
<script src="/tooltip.js"></script>
<script>
function aviso(html) { const a = document.getElementById('aviso'); a.innerHTML = html; a.style.display = 'block'; }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = v => String(v ?? '').split('.')[0].padStart(2, '0');

// Junín y Huancavelica aproximado, hasta que llegan las extensiones reales
let AREA = [[-76.9, -14.2], [-73.3, -10.5]];
const map = new maplibregl.Map({
  container: 'map',
  style: { version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#eef2f5' } }] },
  bounds: AREA, fitBoundsOptions: { padding: 30 },
  maxZoom: 14, fadeDuration: 0, renderWorldCopies: false, attributionControl: false
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

let J = {}, modo = 'poblacion';
let datos = {}, regIds = new Set(), provIds = new Set(), distIds = new Set(), filtro = null;
const fullRegs = new Set(), hidProv = new Set(), hidDist = new Set();
// ¿Se dibuja esta zona? (departamento TODO, o en la lista, y no marcada con OCULTAR)
function visible(g) {
  const dep = [...fullRegs].some(r => r.slice(1, 3) === g.slice(1, 3));
  if (g[0] === '7') return regIds.has(g);
  if (g[0] === '8') return !hidProv.has(g) && (dep || provIds.has(g));
  const prov = '8' + g.slice(1, 5) + '00';
  return !hidDist.has(g) && !hidProv.has(prov) && (dep || provIds.has(prov) || distIds.has(g));
}

map.on('load', async () => {
  const [d, lista, cfg] = await Promise.all([
    fetch('/api/datos').then(r => r.json()).catch(() => ({})),
    fetch('/api/lista').then(r => r.json()).catch(() => []),
    fetch('/api/config').then(r => r.json()).catch(() => ({})),
    fetch('/api/jueces').then(r => r.json()).catch(() => ({}))
  ]).then(r => { J = r[3]; return r; });
  datos = d;
  if (!Object.keys(datos).length) aviso('Falta <b>datos.xlsx</b>. Corre <code>python actualizar_excel.py</code>.');
  if (!lista.length) aviso('Falta <b>lista_trabajo.xlsx</b> junto a server.py (o está vacía).');

  // Qué se dibuja (lista_trabajo.xlsx):
  //  - departamento con MOSTRAR = TODO       -> completo
  //  - departamento con MOSTRAR = SOLO LISTA -> solo sus provincias/distritos de la lista
  //  - cualquier fila con OCULTAR = SI       -> esa zona no se dibuja (excepción)
  for (const f of lista.filter(f => f.en_area && f.id)) {
    const [ids, ocultos] = { 7: [regIds, null], 8: [provIds, hidProv], 9: [distIds, hidDist] }[f.id[0]];
    if (f.ocultar && ocultos) ocultos.add(f.id); else ids.add(f.id);
    if (f.id[0] === '7' && f.mostrar !== 'SOLO LISTA') fullRegs.add(f.id);
  }
  pintarLista(lista);

  // Expresiones sobre las propiedades del distrito en los tiles
  const ID = ['to-number', ['get', 'id_geografia']];
  const REG = ['to-number', ['coalesce', ['get', 'cod_region'], ['get', 'ccdd']]];
  const PROV = ['+', ['*', ['to-number', ['get', 'ccdd']], 100], ['to-number', ['get', 'ccpp']]];
  const lit = (xs) => ['literal', [...xs]];
  const num = xs => [...xs].map(Number);
  const fullCod = [...fullRegs].map(g => +g.slice(1, 3));
  const provCod = [...provIds].map(g => +g.slice(1, 5));
  const depDe = ['%', ['floor', ['/', ID, 10000]], 100]; // id 7/8/9 + ccdd... -> ccdd
  // Distritos que se dibujan (misma regla que visible() más abajo)
  const dentro = ['all',
    ['any', ['in', REG, lit(fullCod)], ['in', PROV, lit(provCod)], ['in', ID, lit(num(distIds))]],
    ['!', ['in', PROV, lit([...hidProv].map(g => +g.slice(1, 5)))]],
    ['!', ['in', ID, lit(num(hidDist))]]];

  map.addSource('inei', { type: 'vector', tiles: [location.origin + '/tiles/{z}/{x}/{y}.pbf'],
    scheme: 'tms', minzoom: 0, maxzoom: cfg.maxzoom || 10,
    promoteId: { tb_region: 'id_geografia', tb_provincia: 'id_geografia', tb_distrito: 'id_geografia' } });
  const fill = (id, layer, filter, color, opacity = 1) => map.addLayer({ id, type: 'fill', source: 'inei',
    'source-layer': layer, filter, paint: { 'fill-color': color, 'fill-opacity': opacity } });
  const line = (id, layer, filter, color, w) => map.addLayer({ id, type: 'line', source: 'inei',
    'source-layer': layer, filter, paint: { 'line-color': color, 'line-width': w } });

  // Solo se dibujan los departamentos de la lista; afuera no hay nada
  fill('f-area', 'tb_distrito', dentro, '#f4f1ea');
  fill('f-prov', 'tb_distrito', ['all', dentro, ['in', PROV, lit(provCod)]], '#fcd34d', 0.6);
  fill('f-dist', 'tb_distrito', ['all', dentro, ['in', ID, lit(num(distIds))]], '#a78bfa', 0.75);
  // ⚖️ Jueces: provincias coloreadas por total (hoja Provincias de jueces.xlsx)
  const colores = ['match', PROV];
  for (const [gid, p] of Object.entries(J.provincias || {})) colores.push(+gid.slice(1, 5), colorJueces(p.total));
  fill('j-prov', 'tb_distrito', dentro, colores.length > 2 ? [...colores, '#f4f1ea'] : '#f4f1ea');
  map.setLayoutProperty('j-prov', 'visibility', 'none');
  line('l-dist', 'tb_distrito', dentro, '#b9b2a3', ['interpolate', ['linear'], ['zoom'], 6, 0.3, 10, 0.9]);
  line('l-prov', 'tb_provincia', ['all', ['any', ['in', depDe, lit(fullCod)], ['in', ID, lit(num(provIds))]],
    ['!', ['in', ID, lit(num(hidProv))]]], '#6b6458', ['interpolate', ['linear'], ['zoom'], 6, 0.9, 10, 1.8]);
  // Borde del departamento solo si se ve completo; con zonas ocultas (ej. Chanchamayo, Satipo) el borde
  // lo dan las provincias que sí se ven
  const conExcepcion = new Set([...hidProv, ...hidDist].map(g => g.slice(1, 3)));
  line('l-reg', 'tb_region', ['in', ID, lit(num([...fullRegs].filter(g => !conExcepcion.has(g.slice(1, 3)))))],
    '#2b2b2b', ['interpolate', ['linear'], ['zoom'], 6, 1.8, 10, 3]);

  const on = ['boolean', ['feature-state', 'hover'], false];
  for (const capa of ['tb_region', 'tb_provincia', 'tb_distrito']) {
    map.addLayer({ id: 'h-' + capa, type: 'fill', source: 'inei', 'source-layer': capa,
      paint: { 'fill-color': '#c8102e', 'fill-opacity': ['case', on, 0.25, 0] } });
    map.addLayer({ id: 'h-' + capa + '-o', type: 'line', source: 'inei', 'source-layer': capa,
      paint: { 'line-color': '#c8102e', 'line-width': ['case', on, 2.5, 0] } });
  }
  Filtro.agregarSeleccion(map, 'inei');

  // ⚖️ Jueces: una burbuja por sede (distrito), tamaño según cantidad (hoja Data_Plana)
  map.addSource('sedes', { type: 'geojson', data: { type: 'FeatureCollection',
    features: (J.sedes || []).filter(s => s.lon != null).map(s => ({ type: 'Feature', properties: { id: s.id, total: s.total },
      geometry: { type: 'Point', coordinates: [s.lon, s.lat] } })) } });
  map.addLayer({ id: 'sedes-c', type: 'circle', source: 'sedes', layout: { visibility: 'none' },
    paint: { 'circle-radius': ['interpolate', ['linear'], ['sqrt', ['get', 'total']], 1, 6, 9, 24],
      'circle-color': '#1f2937', 'circle-opacity': 0.8, 'circle-stroke-color': '#fff', 'circle-stroke-width': 1.5 } });
  pintarJueces();
  let guardado = null;
  try { guardado = localStorage.getItem('modo'); } catch {}
  setModo(guardado === 'jueces' ? 'jueces' : 'poblacion');

  // En los combos solo aparece lo de la lista (una provincia de la lista muestra todos sus distritos)
  // Combos: lo de la lista que se ve (una provincia aparece también si tiene un distrito suelto visible, ej. Palca)
  const permitido = g => g[0] === '8'
    ? (visible(g) && provIds.has(g)) || [...distIds].some(x => visible(x) && x.slice(1, 5) === g.slice(1, 5))
    : visible(g) && (distIds.has(g) || provIds.has('8' + g.slice(1, 5) + '00'));
  // Sin elegir nada: nombres de las provincias que se ven, y de los distritos sueltos (ej. Palca)
  const iniciales = () => Object.keys(datos).filter(g => g[0] === '8' && visible(g))
    .concat([...distIds].filter(g => visible(g) && !visible('8' + g.slice(1, 5) + '00')));
  const ext = await Filtro.extensiones();
  // Un departamento SOLO LISTA se encuadra en lo que se ve, no en todo el departamento
  const cajaDe = ids => {
    const cs = ids.map(g => ext[g]).filter(Boolean);
    return cs.length ? [[Math.min(...cs.map(c => c[0])), Math.min(...cs.map(c => c[1]))],
                        [Math.max(...cs.map(c => c[2])), Math.max(...cs.map(c => c[3]))]] : null;
  };
  const visiblesDe = dep => [...provIds, ...distIds].filter(g => g.slice(1, 3) === dep.slice(1, 3) && visible(g));
  filtro = Filtro.crear({ map, contenedor: document.getElementById('combos'), datos, area: regIds, permitido,
    rotulable: visible, etiquetasIniciales: iniciales,
    alElegir: gid => {
      marcarLista(gid);
      if (!gid) return verTodo();
      const caja = gid[0] === '7' && !fullRegs.has(gid) && cajaDe(visiblesDe(gid));
      caja ? map.fitBounds(caja, { padding: 40, duration: 900 }) : Filtro.acercar(map, gid);
    } });

  // Encuadre exacto de lo que se ve y no dejar irse lejos
  const cajas = [...fullRegs, ...provIds, ...distIds].filter(visible).map(g => ext[g]).filter(Boolean);
  if (cajas.length) {
    AREA = [[Math.min(...cajas.map(c => c[0])), Math.min(...cajas.map(c => c[1]))],
            [Math.max(...cajas.map(c => c[2])), Math.max(...cajas.map(c => c[3]))]];
    map.setMaxBounds([[AREA[0][0] - 3, AREA[0][1] - 3], [AREA[1][0] + 3, AREA[1][1] + 3]]);
    map.fitBounds(AREA, { padding: 30, duration: 0 });
  }
});

// --- ⚖️ Jueces ---
const ESCALA = [[50, '#8e1b2a'], [20, '#c0392b'], [10, '#e36b4f'], [5, '#f3a072'], [1, '#f9c9a4']];
const colorJueces = n => (ESCALA.find(([min]) => n >= min) || [0, '#f4f1ea'])[1];

function setModo(m) {
  modo = m;
  try { localStorage.setItem('modo', m); } catch {}
  document.querySelectorAll('.modo button').forEach(b => b.classList.toggle('on', b.dataset.modo === m));
  const ver = (id, si) => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', si ? 'visible' : 'none');
  ver('f-prov', m === 'poblacion'); ver('f-dist', m === 'poblacion');
  ver('j-prov', m === 'jueces'); ver('sedes-c', m === 'jueces');
  document.getElementById('ley-poblacion').hidden = m !== 'poblacion';
  document.getElementById('ley-jueces').hidden = m !== 'jueces';
  document.getElementById('panel-jueces').hidden = m !== 'jueces';
  clear();
}
document.querySelectorAll('.modo button').forEach(b => b.onclick = () => setModo(b.dataset.modo));

function pintarJueces() {
  const rangos = ESCALA.map(([min], i) => [min, i ? ESCALA[i - 1][0] - 1 : null]).reverse();
  document.getElementById('ley-jueces').innerHTML =
    rangos.map(([a, b]) => `<div><span style="background:${colorJueces(a)}"></span>${a}${b ? '–' + b : '+'} jueces en la provincia</div>`).join('') +
    `<div><span style="background:#f4f1ea;border:1px solid #ccc"></span>Sin jueces en jueces.xlsx</div>` +
    `<div><span style="background:#1f2937;border-radius:50%"></span>Sede (distrito): tamaño = n.º de jueces</div>`;
  const c = J.csjj || {}, provs = Object.entries(J.provincias || {}).sort((a, b) => b[1].total - a[1].total);
  const max = Math.max(1, ...provs.map(([, p]) => p.total));
  document.getElementById('panel-jueces').innerHTML = `
    <div class="card">
      <div>⚖️ Corte Superior de Justicia de Junín</div>
      <div class="grande">${c.total ?? 0} <small style="font-size:13px">jueces y juezas</small></div>
      <div class="grid">
        <span>👨 Varones: <b>${c.varones ?? 0}</b></span><span>👩 Mujeres: <b>${c.mujeres ?? 0}</b></span>
        <span>🟢 Titulares: <b>${c.titulares ?? 0}</b></span><span>🟡 Provisionales: <b>${c.prov ?? 0}</b></span>
        <span>🔴 Supernum.: <b>${c.supern ?? 0}</b></span><span>🏢 Salas: <b>${c.sala ?? 0}</b></span>
        <span>⚡ J. Esp.: <b>${c.jesp ?? 0}</b></span><span>🏘️ JPL: <b>${c.jpl ?? 0}</b></span>
      </div>
    </div>
    <h2>Jueces por provincia</h2>
    <div id="barras">${provs.map(([gid, p]) => `<div class="barra" data-id="${esc(gid)}"><span>${esc(p.nombre)}</span>
      <i style="width:${Math.max(2, 100 * p.total / max)}%"></i><b>${p.total}</b></div>`).join('')}</div>
    ${(J.avisos || []).length ? `<div class="avisos"><b>⚠ Revisar en jueces.xlsx:</b>${J.avisos.map(a => `<div>• ${esc(a)}</div>`).join('')}</div>` : ''}`;
  document.getElementById('barras').onclick = e => {
    const gid = e.target.closest('.barra')?.dataset.id;
    if (gid && !filtro?.ir(gid)) { Filtro.marcar(map, gid); Filtro.acercar(map, gid); }
  };
}

// Qué mostrar en modo jueces bajo el cursor: sede (burbuja) o provincia
function pickJueces(pt) {
  const s = map.queryRenderedFeatures(pt, { layers: ['sedes-c'] })[0];
  if (s) {
    const sede = (J.sedes || []).find(x => x.id === s.properties.id);
    if (sede) return { gid: sede.id, capa: 'tb_distrito', html: tooltipJuecesHTML(sede, esc(sede.nombre), esc(sede.departamento),
      `<div class="bajo">Sede en el distrito · provincia ${esc(sede.provincia)}</div>`) };
  }
  const t = pick(pt);
  if (!t) return null;
  const prov = '8' + t.dist.slice(1, 5) + '00', p = J.provincias?.[prov], d = datos[prov] || {};
  const pie = p ? '' : '<div class="bajo">Sin jueces registrados en jueces.xlsx</div>';
  return { gid: prov, capa: 'tb_provincia', html: tooltipJuecesHTML(p, esc(p?.nombre || d.nombprov || ''), esc(p?.departamento || d.nombregion || ''), pie) };
}

function verTodo() { map.fitBounds(AREA, { padding: 30, duration: 900 }); }
document.getElementById('todo').onclick = () => { filtro?.reiniciar(); marcarLista(null); clear(); verTodo(); };

// --- Lista del panel ---
const NIV = { DEPARTAMENTO: 0, PROVINCIA: 1, DISTRITO: 2 };
function pintarLista(lista) {
  const cont = document.getElementById('lista');
  const dentro = lista.filter(f => f.en_area), fuera = lista.filter(f => !f.en_area);
  const nProv = dentro.filter(f => !f.ocultar && Filtro.N(f.nivel) === 'PROVINCIA').length;
  const nDist = dentro.filter(f => !f.ocultar && Filtro.N(f.nivel) === 'DISTRITO').length;
  const item = f => {
    const niv = Filtro.N(f.nivel);
    const cls = !f.en_area || f.ocultar ? 'fuera' : f.id ? '' : 'falta';
    const extra = f.provincia && niv === 'DISTRITO' ? ` <small>· ${esc(f.provincia)}</small>` : '';
    const falta = f.en_area && !f.id ? ' <small>⚠ no encontrado en datos.xlsx</small>' : '';
    const fueraTxt = !f.en_area ? ` <small>· ${esc(f.departamento)}</small>`
                   : f.ocultar ? ' <small>· oculto (OCULTAR = SI)</small>'
                   : niv === 'DEPARTAMENTO' && f.mostrar === 'SOLO LISTA' ? ' <small>· solo lo de la lista</small>' : '';
    return `<li class="${cls}" data-id="${esc(f.ocultar ? '' : f.id || '')}"><span class="niv n-${esc(niv)}">${esc(niv.slice(0, 4))}</span>` +
           `<span>${esc(f.nombre)}${extra}${fueraTxt}${falta}</span></li>`;
  };
  const orden = (a, b) => (NIV[Filtro.N(a.nivel)] ?? 9) - (NIV[Filtro.N(b.nivel)] ?? 9) || a.nombre.localeCompare(b.nombre, 'es');
  let html = `<h2>Lista (${nProv} provincias · ${nDist} distritos)</h2>`;
  const deps = [...new Set(dentro.map(f => f.departamento || f.nombre))].sort();
  for (const dep of deps)
    html += `<h2>${esc(dep)}</h2><ul>${dentro.filter(f => (f.departamento || f.nombre) === dep).sort(orden).map(item).join('')}</ul>`;
  if (fuera.length)
    html += `<h2>Fuera del área (no se muestran)</h2><ul>${fuera.sort(orden).map(item).join('')}</ul>` +
            `<div class="nota">Para verlos, agrega su departamento a lista_trabajo.xlsx con NIVEL = DEPARTAMENTO.</div>`;
  cont.innerHTML = html;
  cont.onclick = e => {
    const li = e.target.closest('li[data-id]');
    const gid = li?.dataset.id;
    if (!gid) return;
    if (!filtro?.ir(gid)) { Filtro.marcar(map, gid); marcarLista(gid); Filtro.acercar(map, gid); }
  };
}
function marcarLista(gid) {
  document.querySelectorAll('#lista li').forEach(li => li.classList.toggle('activo', !!gid && li.dataset.id === gid));
}

// --- Tooltip y resaltado: muestra lo más específico de la lista bajo el cursor ---
const tip = document.getElementById('tip');
let hovered = null, current = null, lastPoint = null;
function setHighlight(capa, id) {
  if (hovered) map.setFeatureState({ source: 'inei', ...hovered }, { hover: false });
  hovered = capa ? { sourceLayer: capa, id } : null;
  if (hovered) map.setFeatureState({ source: 'inei', ...hovered }, { hover: true });
}
function pick(pt) {
  if (!map.getLayer('f-area')) return null;
  const hit = map.queryRenderedFeatures(pt, { layers: ['f-area'] })[0];
  if (!hit) return null;
  const p = hit.properties;
  const dist = String(p.id_geografia).split('.')[0];
  const prov = '8' + pad(p.ccdd) + pad(p.ccpp) + '00';
  const reg = '7' + pad(p.cod_region ?? p.ccdd) + '0000';
  const gid = distIds.has(dist) ? dist : provIds.has(prov) ? prov : reg;
  return { gid, capa: Filtro.CAPA[gid[0]], dist };
}
function place(pt) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight, c = map.getContainer();
  let x = pt.x + pad, y = pt.y + pad;
  if (x + w > c.clientWidth) x = pt.x - w - pad;
  if (y + h > c.clientHeight) y = pt.y - h - pad;
  tip.style.transform = `translate(${x}px, ${y}px)`;
}
function clear() { tip.style.display = 'none'; setHighlight(null); current = null; map.getCanvas().style.cursor = ''; }
function update(pt) {
  if (modo === 'jueces') {
    const j = pickJueces(pt);
    if (!j) return clear();
    map.getCanvas().style.cursor = 'pointer';
    if ('j|' + j.gid !== current) {
      current = 'j|' + j.gid;
      setHighlight(j.capa, +j.gid);
      tip.innerHTML = j.html; tip.style.display = 'block';
    }
    return place(pt);
  }
  const t = pick(pt);
  if (!t) return clear();
  map.getCanvas().style.cursor = 'pointer';
  const key = t.gid + '|' + t.dist;
  if (key !== current) {
    current = key;
    setHighlight(t.capa, +t.gid);
    const d = datos[t.gid];
    const bajo = t.gid !== t.dist && datos[t.dist] ? `<div class="bajo">Distrito bajo el cursor: ${esc(datos[t.dist].nombdist)}</div>` : '';
    if (d) { tip.innerHTML = tooltipHTML(d, bajo); tip.style.display = 'block'; } else tip.style.display = 'none';
  }
  if (tip.style.display === 'block') place(pt);
}
let pending = false;
function schedule(pt) {
  lastPoint = pt;
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; if (lastPoint) update(lastPoint); });
}
map.on('mousemove', e => schedule(e.point));
map.on('mouseout', () => { lastPoint = null; clear(); });
map.on('movestart', () => { if (!matchMedia('(hover: hover)').matches) clear(); });
// Clic: acercarse a lo de la lista que está bajo el cursor (y poner los combos ahí)
map.on('click', e => {
  const t = modo === 'jueces' ? pickJueces(e.point) : pick(e.point);
  schedule(e.point);
  if (!t) return;
  if (!filtro?.ir(t.gid)) { Filtro.marcar(map, t.gid); marcarLista(t.gid); Filtro.acercar(map, t.gid); }
});
</script>
</body>
