<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa del Perú - Censo 2025</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237f1d2d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3v17M8 20h8M4 7h16'/%3E%3Cpath d='M7 7l-3 6a3 3 0 0 0 6 0L7 7zM17 7l-3 6a3 3 0 0 0 6 0l-3-6z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; background: #eef2f5; font-family: system-ui, sans-serif; }
  #lvl { position: absolute; top: 10px; left: 10px; z-index: 5; background: #fff; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.2); display: flex; gap: 8px; align-items: center; }
  #home { font: inherit; border: 1px solid #ccc; background: #fff; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  #home:hover { background: #f3f3f3; }
  #filtro { position: absolute; top: 52px; left: 10px; z-index: 5; width: 220px; max-width: calc(100% - 80px);
    background: #fff; border-radius: 6px; padding: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.2);
    display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  #combos { display: flex; flex-direction: column; gap: 8px; }
  #filtro a { color: #c8102e; text-decoration: none; font-weight: 600; }
  #aviso { position: absolute; left: 50%; top: 50px; transform: translateX(-50%); z-index: 9; display: none;
    max-width: min(560px, calc(100% - 32px)); background: #fff3cd; color: #5c4400; border: 1px solid #e0b84c;
    border-radius: 8px; padding: 10px 14px; font-size: 14px; line-height: 1.5; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  #aviso code { background: #fff; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="lvl"><span id="lvl-txt">Nivel: Departamento</span> <button id="home" title="Ver todo el Perú">⟲ Perú</button></div>
<div id="filtro"><div id="combos"></div><a href="/trabajo">Mapa de trabajo (Junín y Huancavelica) →</a></div>
<div id="tip"></div>
<div id="aviso"></div>
<script>
// Si algo falla, se muestra aquí en vez de dejar la pantalla en blanco
function aviso(html) { const a = document.getElementById('aviso'); a.innerHTML = html; a.style.display = 'block'; }
if (location.protocol === 'file:')
  aviso('Abriste el archivo directamente. Corre <code>python server.py</code> y entra a ' +
        '<a href="http://localhost:8000">http://localhost:8000</a>');
</script>
<script src="/vendor/maplibre-gl.js"></script>
<script src="/filtro.js"></script>
<script src="/tooltip.js"></script>
<script>
if (typeof maplibregl === 'undefined' && location.protocol !== 'file:')
  aviso('No cargó la librería del mapa (<code>vendor/maplibre-gl.js</code>). Haz <code>git pull</code> ' +
        'y revisa que exista la carpeta <code>vendor/</code> junto a server.py.');
const PERU = [[-81.5, -18.5], [-68.5, 0.2]];
const map = new maplibregl.Map({
  container: 'map',
  style: { version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#eef2f5' } }] },
  bounds: PERU,
  fitBoundsOptions: { padding: 20 },
  maxZoom: 14,
  minZoom: 3,
  fadeDuration: 0,
  renderWorldCopies: false,
  attributionControl: false
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

// Niveles según zoom: región < 6, provincia 6-8, distrito >= 8
const levelOf = z => z < 6 ? 'tb_region' : z < 8 ? 'tb_provincia' : 'tb_distrito';
const levelName = { tb_region: 'Departamento', tb_provincia: 'Provincia', tb_distrito: 'Distrito' };
const levelZoom = { tb_region: [0, 6], tb_provincia: [6, 8], tb_distrito: [8, 24] };

map.on('load', async () => {
  // Zoom máximo descargado en cache_tiles/; más allá, MapLibre amplía esos mismos tiles
  const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
  const { maxzoom } = cfg;
  if (!cfg.tiles) aviso('No hay tiles descargados en <code>cache_tiles/</code>. Corre <code>python descargar_todo.py</code> ' +
                        '(en la misma carpeta que server.py) y espera a que termine.');
  else if (!cfg.tiles_con_datos) aviso('Los tiles descargados están vacíos. Borra la carpeta <code>cache_tiles</code> ' +
                                       'y vuelve a correr <code>python descargar_todo.py</code>.');
  else if (!cfg.excel) aviso('Falta <code>datos.xlsx</code>: el mapa se ve pero sin textos. Corre <code>python actualizar_excel.py</code>.');
  let errores = 0;
  map.on('error', e => { if (errores++ === 0) aviso('Error al cargar el mapa: ' + esc(e.error?.message || e.error)); });
  // promoteId: el id_geografia pasa a ser el id de cada polígono -> resaltado con feature-state
  map.addSource('inei', { type: 'vector', tiles: [location.origin + '/tiles/{z}/{x}/{y}.pbf'],
    scheme: 'tms', minzoom: 0, maxzoom: maxzoom || 10,
    promoteId: { tb_region: 'id_geografia', tb_provincia: 'id_geografia', tb_distrito: 'id_geografia' } });

  const line = (id, layer, color, w, minzoom = 0) => map.addLayer({
    id, type: 'line', source: 'inei', 'source-layer': layer, minzoom,
    paint: { 'line-color': color, 'line-width': w } });

  map.addLayer({ id: 'f-dist', type: 'fill', source: 'inei', 'source-layer': 'tb_distrito',
    paint: { 'fill-color': '#fbfaf6' } });
  line('l-dist', 'tb_distrito', '#b9b2a3', ['interpolate', ['linear'], ['zoom'], 5, 0.2, 10, 0.8], 5);
  line('l-prov', 'tb_provincia', '#7a7466', ['interpolate', ['linear'], ['zoom'], 4, 0.4, 10, 1.6]);
  line('l-reg', 'tb_region', '#2b2b2b', ['interpolate', ['linear'], ['zoom'], 3, 0.8, 10, 2.4]);

  // Resaltado: una capa por nivel, visible solo en su rango de zoom.
  // Usa feature-state (no setFilter), así el mapa no se re-procesa en cada movimiento.
  const on = ['boolean', ['feature-state', 'hover'], false];
  for (const lyr of Object.keys(levelName)) {
    const [minzoom, maxzoom] = levelZoom[lyr];
    map.addLayer({ id: 'h-' + lyr, type: 'fill', source: 'inei', 'source-layer': lyr, minzoom, maxzoom,
      paint: { 'fill-color': '#c8102e', 'fill-opacity': ['case', on, 0.35, 0] } });
    map.addLayer({ id: 'h-' + lyr + '-o', type: 'line', source: 'inei', 'source-layer': lyr, minzoom, maxzoom,
      paint: { 'line-color': '#c8102e', 'line-width': ['case', on, 2.5, 0] } });
  }

  // Combos Departamento -> Provincia -> Distrito (filtro.js)
  Filtro.agregarSeleccion(map, 'inei');
  excel.then(datos => {
    filtro = Filtro.crear({ map, contenedor: document.getElementById('combos'), datos,
      alElegir: gid => gid ? Filtro.acercar(map, gid) : map.fitBounds(PERU, { padding: 20, duration: 900 }) });
  });
});
let filtro = null;

let hovered = null; // { sourceLayer, id }
function setHighlight(layer, id) {
  if (hovered) map.setFeatureState({ source: 'inei', ...hovered }, { hover: false });
  hovered = id > 0 ? { sourceLayer: layer, id } : null;
  if (hovered) map.setFeatureState({ source: 'inei', ...hovered }, { hover: true });
}

const tip = document.getElementById('tip');
const lvl = document.getElementById('lvl-txt');

// Textos del tooltip: se cargan una sola vez desde datos.xlsx (vía /api/datos). Todo local.
const excel = fetch('/api/datos').then(r => r.json()).catch(() => ({}));
const loadTip = id => excel.then(d => d[id]);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));


let lastPoint = null;
function place(pt) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = pt.x + pad, y = pt.y + pad;
  if (x + w > innerWidth) x = pt.x - w - pad;
  if (y + h > innerHeight) y = pt.y - h - pad;
  tip.style.transform = `translate(${x}px, ${y}px)`;
}

map.on('zoom', () => { lvl.textContent = 'Nivel: ' + levelName[levelOf(map.getZoom())]; });

let current = null, curLayer = null;
function clear() {
  tip.style.display = 'none'; setHighlight(null, -1); current = null; curLayer = null;
  map.getCanvas().style.cursor = '';
}

// Zona bajo el puntero según el nivel del zoom actual: { layer, gid } o null
function pick(pt) {
  if (!map.getLayer('f-dist')) return null;
  const layer = levelOf(map.getZoom());
  const hit = map.queryRenderedFeatures(pt, { layers: ['f-dist'] })[0];
  if (!hit) { // sin distrito bajo el puntero: se usa directo la capa del nivel
    const h = map.queryRenderedFeatures(pt, { layers: ['h-' + layer] })[0];
    return h && h.properties.id_geografia ? { layer, gid: +h.properties.id_geografia } : null;
  }
  // El distrito trae ccdd/ccpp, de ahí se derivan los ids de provincia y región
  // id_geografia del nivel: distrito 9xxxxxx; prov 8 + ccdd+ccpp; región 7 + ccdd
  const p = hit.properties;
  const gid = layer === 'tb_distrito' ? +p.id_geografia
            : layer === 'tb_provincia' ? +('8' + p.ccdd + p.ccpp + '00')
            : +('7' + p.cod_region + '0000');
  return { layer, gid };
}

function update(pt) {
  const t = pick(pt);
  if (!t) return clear();
  map.getCanvas().style.cursor = 'pointer';
  const { layer, gid } = t;
  if (gid !== current || layer !== curLayer) {
    current = gid; curLayer = layer;
    setHighlight(layer, gid);
    loadTip(gid).then(d => {
      if (current !== gid || !d) return;
      tip.innerHTML = tooltipHTML(d); tip.style.display = 'block'; place(lastPoint);
    }).catch(() => { tip.style.display = 'none'; });
  }
  if (tip.style.display === 'block') place(pt);
}

// Un solo cálculo por frame aunque el mouse dispare muchos eventos
let pending = false;
function schedule(pt) {
  lastPoint = pt;
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; if (lastPoint) update(lastPoint); });
}
map.on('mousemove', e => schedule(e.point));
// Clic = acercarse a esa zona, como en el INEI: departamento -> sus provincias -> sus distritos
const siguienteNivel = { tb_region: 6.2, tb_provincia: 8.2, tb_distrito: 0 }; // zoom mínimo al llegar

function extension(layer, gid) {
  // Une los pedazos del polígono que están en los tiles cargados (cada tile trae solo su parte)
  const fs = map.querySourceFeatures('inei', { sourceLayer: layer,
    filter: ['==', ['to-number', ['get', 'id_geografia']], gid] });
  let b = null;
  const walk = c => {
    if (typeof c[0] === 'number') { b = b ? b.extend(c) : new maplibregl.LngLatBounds(c, c); return; }
    c.forEach(walk);
  };
  fs.forEach(f => walk(f.geometry.coordinates));
  return b;
}

function acercar(pt, lngLat) {
  const t = pick(pt);
  if (!t) return;
  const b = extension(t.layer, t.gid);
  const cam = b ? map.cameraForBounds(b, { padding: 40 }) : { center: lngLat, zoom: map.getZoom() + 2 };
  if (!cam) return;
  const zoom = Math.min(Math.max(cam.zoom, siguienteNivel[t.layer]), 13);
  if (zoom < map.getZoom() + 0.1) return; // ya estás encima de esa zona: el clic nunca aleja
  clear();
  map.flyTo({ center: cam.center, zoom, duration: 900, essential: true });
}

map.on('click', e => { acercar(e.point, e.lngLat); schedule(e.point); }); // en celular el toque también muestra el tooltip
map.on('moveend', () => { if (lastPoint && matchMedia('(hover: hover)').matches) schedule(lastPoint); });
document.getElementById('home').onclick = () => { clear(); filtro?.reiniciar(); map.fitBounds(PERU, { padding: 20, duration: 900 }); };
map.on('mouseout', () => { lastPoint = null; clear(); });
map.on('movestart', () => { if (!matchMedia('(hover: hover)').matches) clear(); });
</script>
</body>
</html>
